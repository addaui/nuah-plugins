[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.3.0"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
nuah-kernel = { git = "https://github.com/addaui/nuah", tag = "v0.11.0" }
nuah-adapters = { git = "https://github.com/addaui/nuah", tag = "v0.11.0" }
serde_json = "1.0.154"


# Local until Nuah's class (ADR 0080) is tagged.
[patch."https://github.com/addaui/nuah"]
nuah-kernel = { path = "../nuah/crates/nuah-kernel" }
nuah-adapters = { path = "../nuah/crates/nuah-adapters" }
